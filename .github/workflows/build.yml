name: FAN SUPER Build

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 (Chaquopy derleme için)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Python meclisi testi (hızlı geri alma)
        run: |
          pip install "numpy<2"
          cd app/src/main/python
          set +e
          python - > py_smoke.log 2>&1 <<'PY'
          import json, time, fan_super as fs
          v=[i%4 for i in range(120)]; t=[1700000000+i for i in range(120)]
          fs.configure(json.dumps({"window":100}))
          r=json.loads(fs.replay(json.dumps(v), json.dumps(t)))
          assert len(r["per"])==120 and len(r["next"])==4
          nxt=r["next"]
          fs.step(1, 1700000200)
          t0=time.time(); back=json.loads(fs.undo_to(120)); dt=(time.time()-t0)*1000.0
          assert max(abs(a-b) for a,b in zip(nxt,back)) < 1e-12, "geri alma tahmini bozdu"
          assert dt < 2000, "geri alma cok yavas: %.1f ms" % dt
          assert fs.undo_to(80), "derin geri alma basarisiz"
          print("Python meclisi OK · undo %.1f ms ·" % dt, fs.info())
          PY
          r1=$?
          python ../../test/python/test_fan_super.py -v > py_undo.log 2>&1
          r2=$?
          set -e
          R1=$r1 R2=$r2 python3 - <<'ANN'
          import os
          def esc(t):
              return t.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          rc = {"smoke": int(os.environ["R1"]), "unittest": int(os.environ["R2"])}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Python meclisi\n')
              for name, log in (("smoke", "py_smoke.log"), ("unittest", "py_undo.log")):
                  try:
                      text = open(log, encoding="utf-8", errors="replace").read()
                  except Exception as e:
                      text = "log okunamadi: %s" % e
                  tail = text[-5000:]
                  summary.write('- **%s**: exit %d\n\n```\n%s\n```\n' % (name, rc[name], text[-2000:]))
                  print('::%s title=python-%s (exit %d)::%s' % (
                      'error' if rc[name] else 'notice', name, rc[name], esc(tail)))
          ANN
          [ "$r1" = "0" ] && [ "$r2" = "0" ]

      - name: Overlay testleri ve APK derle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Test sonuçları (annotation)
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, os, xml.etree.ElementTree as ET
          def escape(text):
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
                  suite = ET.parse(path).getroot()
                  print('::notice title=Overlay test results::Tests: %s; failures: %s; errors: %s' % (
                      suite.get('tests'), suite.get('failures'), suite.get('errors')))
                  summary.write('### %s\nTests: %s · Failures: %s · Errors: %s\n' % (
                      suite.get('name'), suite.get('tests'), suite.get('failures'), suite.get('errors')))
                  for case in suite.findall('testcase'):
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          print('::error title=%s::%s' % (escape(case.get('name', 'Test')), escape((failure.text or failure.get('message', ''))[:6000])))
          PYTEST

      - name: Hata özeti (annotation)
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^e: |error:|What went wrong|Could not|> [A-Z]|FAILURE|Exception|Caused by|not found|Unresolved|ERROR" build.log | grep -v "^\s*at " | head -120 > err.txt || true
            [ -s err.txt ] || tail -80 build.log > err.txt
          else
            echo "build.log yok (derleme adımı çalışmadı)" > err.txt
          fi
          python3 - <<'PY'
          lines=open('err.txt',encoding='utf-8',errors='replace').read().splitlines()
          for i in range(0,len(lines),30):
              chunk='%0A'.join(l.replace('%','%25').replace('\r','') for l in lines[i:i+30])
              print('::error title=build-log-%d::%s' % (i//30, chunk))
          PY

      - name: Test raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Sürümlü APK ve kaynak ZIP paketi
        id: package
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PYVERSION'
          import json
          with open("app/build/outputs/apk/debug/output-metadata.json") as f:
              print(json.load(f)["elements"][0]["versionName"])
          PYVERSION
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/FAN_SUPER_v${VERSION}_build${{ github.run_number }}.apk"
          # Yalnızca bu commit'in kaynakları; yerel ayarlar, anahtarlar, loglar ve build dosyaları yok.
          git archive --format=zip --prefix="FanSuper_v${VERSION}/" --output="out/FanSuper_v${VERSION}.zip" HEAD
          (cd out && sha256sum *.apk *.zip > SHA256SUMS.txt)
          unzip -t "out/FanSuper_v${VERSION}.zip" | tail -1
          ls -lh out

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: FAN_SUPER_APK
          path: out/*.apk

      - name: Kaynak kod artifact'ı
        uses: actions/upload-artifact@v4
        with:
          name: FanSuper_SOURCE
          path: |
            out/FanSuper_v*.zip
            out/SHA256SUMS.txt

      - name: Release (main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}-build${{ github.run_number }}
          name: FAN SUPER v${{ steps.package.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## FAN SUPER v${{ steps.package.outputs.version }}
            - Eski mavi overlay geri geldi; Kalıp satırı kaldırıldı.
            - Kotlin/Python rakam ve yan tahminleri ayrı satırlarda.
            - Son 6 veri, en yeni solda; DEL–4–3–2–1 düğmeleri alt alta.
            - Sürükleme ve ekran sınırları; meclis motorları korunur.

            **FAN_SUPER_v${{ steps.package.outputs.version }}_build${{ github.run_number }}.apk** → Android uygulaması (debug imzalı).
            **FanSuper_v${{ steps.package.outputs.version }}.zip** → bu sürümün kaynak kodları.
            **SHA256SUMS.txt** → APK ve ZIP doğrulama özetleri.
          files: |
            out/*.apk
            out/FanSuper_v*.zip
            out/SHA256SUMS.txt
