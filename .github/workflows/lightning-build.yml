name: Lightning Roulette AI Build

on:
  push:
    branches: [ main, "arena/**" ]
    paths:
      - "LightningRouletteAI/**"
      - ".github/workflows/lightning-build.yml"
  pull_request:
    paths:
      - "LightningRouletteAI/**"
      - ".github/workflows/lightning-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: LightningRouletteAI
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 (Chaquopy derleme + meclis testi)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Python meclisi testleri (sızıntı · determinizm · geri alma)
        run: |
          pip install "numpy<2"
          python -m unittest -v python_tests.test_council 2>&1 | tee py_test.log
          echo "### Python meclisi" >> "$GITHUB_STEP_SUMMARY"
          tail -n 8 py_test.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Kotlin derle (hızlı hata geri bildirimi)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:compileDebugKotlin 2>&1 | tee compile.log

      - name: Birim testleri ve APK derle
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Test sonuçları (özet)
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, os, xml.etree.ElementTree as ET
          def escape(text):
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          tot = fail = 0
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Kotlin birim testleri\n')
              for path in sorted(glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')):
                  suite = ET.parse(path).getroot()
                  t, f, e = int(suite.get('tests')), int(suite.get('failures')), int(suite.get('errors'))
                  tot += t; fail += f + e
                  summary.write('- %s: %d test · %d hata\n' % (suite.get('name'), t, f + e))
                  for case in suite.findall('testcase'):
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          print('::error title=%s::%s' % (escape(case.get('name', 'Test')), escape((failure.text or failure.get('message', ''))[:4000])))
              summary.write('\n**Toplam: %d test, %d hata**\n' % (tot, fail))
          print('::notice title=Kotlin testleri::%d test, %d hata' % (tot, fail))
          PYTEST

      - name: Hata özeti
        if: failure()
        run: |
          for f in compile.log build.log; do
            [ -f "$f" ] || continue
            grep -E "^e: |error:|What went wrong|Could not|> [A-Z]|FAILURE|Unresolved|Caused by|ERROR|FAILED" "$f" | grep -v "^\s*at " | head -80 > err_$f.txt || true
          done
          python3 - <<'PY'
          import glob
          for path in sorted(glob.glob('err_*.txt')):
              lines = open(path, encoding='utf-8', errors='replace').read().splitlines()
              for i in range(0, len(lines), 25):
                  chunk = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in lines[i:i + 25])
                  print('::error title=%s-%d::%s' % (path, i // 25, chunk))
          PY

      - name: Test raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-test-reports
          path: |
            LightningRouletteAI/app/build/reports/tests/
            LightningRouletteAI/app/build/test-results/
          if-no-files-found: ignore

      - name: Sürümlü APK paketi
        id: package
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/LightningRouletteAI_v${VERSION}_build${{ github.run_number }}.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh out

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: LIGHTNING_ROULETTE_AI_APK
          path: LightningRouletteAI/out/*

      - name: Release ([release] içeren commit mesajı veya main)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lightning-v${{ steps.package.outputs.version }}-build${{ github.run_number }}
          name: Lightning Roulette AI v${{ steps.package.outputs.version }} (build ${{ github.run_number }})
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            ## Lightning Roulette AI v${{ steps.package.outputs.version }}
            Avrupa ruleti (0–36) araştırma ve tahmin uygulaması. **Gelecek bilinmez; hiçbir sonuç garanti edilmez.**
            Akış: tahmin → LOCK → gerçek sonuç → değerlendirme → öğrenme. Çevrimdışı çalışır (internet izni yok).

            **LightningRouletteAI_v${{ steps.package.outputs.version }}_build${{ github.run_number }}.apk** → Android uygulaması (release derleme, debug anahtarıyla imzalı).
            **SHA256SUMS.txt** → doğrulama özeti.
          files: |
            LightningRouletteAI/out/*.apk
            LightningRouletteAI/out/SHA256SUMS.txt
